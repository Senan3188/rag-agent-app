[project]
name = "rag-agent-app"
version = "0.1.0"
description = "Local document question answering with FastAPI, LangGraph and Ollama"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "langgraph>=1,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20",
  "pypdf>=6,<7",
  "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
